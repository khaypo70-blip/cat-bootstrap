name: Build CAT bootstrap

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: termux-packages repository
        default: termux/termux-packages
        required: true
      source_ref:
        description: branch, tag or commit
        default: master
        required: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APP_PACKAGE: com.tyron.code
    steps:
      - name: Check out termux-packages
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set app package name
        run: |
          sed -i -E "s/^(TERMUX_APP__PACKAGE_NAME|TERMUX_APP_PACKAGE)=\"com\.termux\"/\1=\"$APP_PACKAGE\"/" scripts/properties.sh
          grep -nE '^(TERMUX_APP__PACKAGE_NAME|TERMUX_APP_PACKAGE)=' scripts/properties.sh

      - name: Verify prefix (stop early if wrong)
        run: |
          prefix=$(bash -c 'export TERMUX_SCRIPTDIR="$PWD"; . scripts/properties.sh >/dev/null; echo "${TERMUX__PREFIX:-$TERMUX_PREFIX}"')
          echo "Prefix: $prefix"
          test "$prefix" = "/data/data/$APP_PACKAGE/files/usr"

      - name: Record commit and fix a known bootstrap script bug
        run: |
          git log -1 --format='termux-packages commit: %H %cI'
          f=scripts/build-bootstraps.sh
          # In main(), $package_arch is never set; the architecture is in $TERMUX_ARCH.
          if grep -q 'add_termux_bootstrap_second_stage_files "$package_arch"' "$f"; then
            sed -i 's/add_termux_bootstrap_second_stage_files "$package_arch"/add_termux_bootstrap_second_stage_files "$TERMUX_ARCH"/' "$f"
            echo "patched"
          else
            echo "pattern not present, nothing changed"
          fi
          grep -n 'add_termux_bootstrap_second_stage_files' "$f"

      - name: Resolve subpackage names and check the package list
        run: |
          cat > "$RUNNER_TEMP/subpkg.py" <<'PY'
          import pathlib, re
          path = pathlib.Path("scripts/build-bootstraps.sh")
          text = path.read_text()
          anchor = re.compile(r'^([ \t]*)local package_name="\$2"[ \t]*\n', re.M)
          if len(anchor.findall(text)) != 1:
              raise SystemExit("build_package() has changed; not patching")
          fix = """if ! compgen -G "$TERMUX_SCRIPTDIR/*packages/$package_name/build.sh" >/dev/null; then
              local sub
              sub=$(compgen -G "$TERMUX_SCRIPTDIR/*packages/*/$package_name.subpackage.sh" | head -n1 || true)
              if [ -n "$sub" ]; then
                  echo "[*] '$package_name' is a subpackage of '$(basename "$(dirname "$sub")")'"
                  package_name=$(basename "$(dirname "$sub")")
              fi
          fi
          """
          path.write_text(anchor.sub(lambda m: m.group(0) + fix, text))

          # Check every listed name now, not an hour into the build.
          missing = []
          for name in re.findall(r'^[ \t]*PACKAGES\+=\("([a-z0-9][^"$]*)"\)', text, re.M):
              own = list(pathlib.Path(".").glob(f"*packages/{name}/build.sh"))
              sub = sorted(pathlib.Path(".").glob(f"*packages/*/{name}.subpackage.sh"))
              if own:
                  print(f"ok       {name}")
              elif sub:
                  print(f"ok       {name} (from {sub[0].parent.name})")
              else:
                  print(f"MISSING  {name}")
                  missing.append(name)
          if missing:
              raise SystemExit("No recipe for: " + ", ".join(missing))
          PY
          python3 -I "$RUNNER_TEMP/subpkg.py"
          bash -n scripts/build-bootstraps.sh

      - name: Build aarch64 bootstrap
        timeout-minutes: 320
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 2>&1 | tee build.log

      - name: Upload bootstrap
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-aarch64
          path: bootstrap-aarch64.zip
          if-no-files-found: error

      - name: Upload deb packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debs-aarch64
          path: output/*.deb
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
