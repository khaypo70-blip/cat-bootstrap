name: Build CAT bootstrap

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: termux-packages repository
        default: agnostic-apollo/termux-packages
        required: true
      source_ref:
        description: branch (recommended by the Termux wiki)
        default: infra-improvs
        required: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APP_PACKAGE: com.tyron.code
    steps:
      - name: Check out termux-packages
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set app package name
        run: |
          sed -i -E "s/^(TERMUX_APP__PACKAGE_NAME|TERMUX_APP_PACKAGE)=\"com\.termux\"/\1=\"$APP_PACKAGE\"/" scripts/properties.sh
          grep -nE '^(TERMUX_APP__PACKAGE_NAME|TERMUX_APP_PACKAGE)=' scripts/properties.sh

      - name: Verify prefix (stop early if wrong)
        run: |
          prefix=$(bash -c 'export TERMUX_SCRIPTDIR="$PWD"; . scripts/properties.sh >/dev/null; echo "${TERMUX__PREFIX:-$TERMUX_PREFIX}"')
          echo "Prefix: $prefix"
          test "$prefix" = "/data/data/$APP_PACKAGE/files/usr"

      - name: Verify foot source and fix its checksum
        run: |
          cat > "$RUNNER_TEMP/verify_foot.py" <<'PY'
          import gzip, hashlib, pathlib, subprocess, sys, urllib.request, zlib

          URL = "https://codeberg.org/dnkl/foot/archive/1.23.1.tar.gz"
          PINNED = "02072b8f0aaf26907b6b02293c875539ce52fc59079344e7cf811ab03394cfa3"
          sha = lambda b: hashlib.sha256(b).hexdigest()

          def variants(tar):
              for level in range(1, 10):
                  c = zlib.compressobj(level, zlib.DEFLATED, -15, 8)
                  body = c.compress(tar) + c.flush()
                  tail = zlib.crc32(tar).to_bytes(4, "little") + (len(tar) & 0xffffffff).to_bytes(4, "little")
                  for xfl in (0, 2, 4):
                      for os_byte in (3, 255):
                          yield f"zlib level {level}", b"\x1f\x8b\x08\x00\0\0\0\0" + bytes([xfl, os_byte]) + body + tail
                  yield f"gzip -n -{level}", subprocess.run(["gzip", "-cn", f"-{level}"], input=tar, capture_output=True, check=True).stdout

          def check(data, pinned):
              if sha(data) == pinned:
                  return "identical file"
              tar = gzip.decompress(data)
              return next((name for name, out in variants(tar) if sha(out) == pinned), None)

          if __name__ == "__main__":
              files = [p for p in pathlib.Path("packages").rglob("*.sh") if p.is_file() and PINNED in p.read_text(errors="ignore")]
              if not files:
                  sys.exit("Pinned checksum not found under packages/")
              data = urllib.request.urlopen(URL, timeout=120).read()
              how = check(data, PINNED)
              print("downloaded sha256:", sha(data))
              print("tar sha256:", sha(gzip.decompress(data)))
              if how is None:
                  sys.exit("NOT VERIFIED: could not reproduce the pinned archive. Checksum left unchanged.")
              print("VERIFIED against pinned checksum:", how)
              for p in files:
                  p.write_text(p.read_text().replace(PINNED, sha(data)))
                  print("updated", p)
          PY
          python3 -I "$RUNNER_TEMP/verify_foot.py"

      - name: Set up Android SDK and NDK in the builder container
        timeout-minutes: 30
        run: ./scripts/run-docker.sh ./scripts/setup-android-sdk.sh

      - name: Build aarch64 bootstrap
        timeout-minutes: 320
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 2>&1 | tee build.log

      - name: Upload bootstrap
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-aarch64
          path: bootstrap-aarch64.zip
          if-no-files-found: error

      - name: Upload deb packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debs-aarch64
          path: output/*.deb
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
