name: Assemble CAT release bootstrap

on:
  workflow_dispatch:
    inputs:
      bootstrap_run_id:
        description: Run ID that has the debs-aarch64 artifact
        required: true
      git_ssh_run_id:
        description: Run ID that has the git-ssh-debs-aarch64 artifact
        required: true
      extra_packages:
        description: Packages to include besides the standard bootstrap list
        default: git,openssh,python
        required: true

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_PACKAGE: com.tyron.code
    steps:
      # Pinned to the commit these steps were tested against. Nothing is compiled here.
      - name: Check out termux-packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: 2c85acb42b2ca1f884566cbd45aa716c37b3426b

      - name: Download debs from the bootstrap run
        uses: actions/download-artifact@v4
        with:
          name: debs-aarch64
          path: ${{ runner.temp }}/base
          run-id: ${{ inputs.bootstrap_run_id }}
          github-token: ${{ github.token }}

      - name: Download debs from the git and openssh run
        uses: actions/download-artifact@v4
        with:
          name: git-ssh-debs-aarch64
          path: ${{ runner.temp }}/gitssh
          run-id: ${{ inputs.git_ssh_run_id }}
          github-token: ${{ github.token }}

      # A file present in both runs is taken from the bootstrap run.
      - name: Merge debs
        run: |
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b" output
          tar -xf "$RUNNER_TEMP/base/debs-aarch64.tar" -C "$RUNNER_TEMP/a"
          tar -xf "$RUNNER_TEMP/gitssh/git-ssh-debs-aarch64.tar" -C "$RUNNER_TEMP/b"
          (cd "$RUNNER_TEMP/b" && sha256sum -c --quiet SHA256SUMS)
          cp "$RUNNER_TEMP"/a/*.deb output/
          for deb in "$RUNNER_TEMP"/b/*.deb; do
            [ -e "output/$(basename "$deb")" ] || cp "$deb" output/
          done
          echo "deb files: $(ls output/*.deb | wc -l)"

      # The bootstrap script packs every deb in output/, including ones that were
      # only needed while compiling. Keep the wanted packages and what they depend on.
      - name: Keep only the needed packages
        env:
          EXTRA: ${{ inputs.extra_packages }}
        run: |
          cat > "$RUNNER_TEMP/select.py" <<'PY'
          import os, pathlib, re, subprocess, sys

          debs, provides = {}, {}
          for path in sorted(pathlib.Path("output").glob("*.deb")):
              out = subprocess.run(["dpkg-deb", "-f", str(path), "Package", "Version", "Architecture",
                                    "Depends", "Pre-Depends", "Provides"],
                                   check=True, capture_output=True, text=True).stdout
              info = dict(line.split(": ", 1) for line in out.splitlines() if ": " in line)
              if info["Architecture"] not in ("aarch64", "all") or info["Package"].endswith("-static"):
                  continue
              info["path"] = path
              debs.setdefault(info["Package"], []).append(info)
              for item in info.get("Provides", "").split(","):
                  name = item.split("(")[0].strip()
                  if name:
                      provides.setdefault(name, set()).add(info["Package"])

          script = pathlib.Path("scripts/build-bootstraps.sh").read_text()
          roots = re.findall(r'^[ \t]*PACKAGES\+=\("([a-z0-9][^"$]*)"\)', script, re.M)
          roots = [r for r in roots if r != "proot"]  # only used by the other bootstrap variant
          roots += [r.strip() for r in os.environ["EXTRA"].split(",") if r.strip()]

          def find(name):
              if name in debs:
                  return name
              return sorted(provides[name])[0] if name in provides else None

          chosen, missing = {}, []
          todo = [([r], "wanted") for r in roots]
          while todo:
              names, why = todo.pop(0)
              name = next((f for f in map(find, names) if f), None)
              if name is None:
                  missing.append(f"{' | '.join(names)} ({why})")
                  continue
              if name in chosen:
                  continue
              versions = debs[name]
              if len(versions) != 1:
                  sys.exit(f"{name}: more than one version: " + ", ".join(v['Version'] for v in versions))
              chosen[name] = versions[0]
              for field in ("Pre-Depends", "Depends"):
                  for group in versions[0].get(field, "").split(","):
                      options = [o.split("(")[0].split(":")[0].strip() for o in group.split("|")]
                      options = [o for o in options if o]
                      if options:
                          todo.append((options, f"needed by {name}"))
          if missing:
              sys.exit("No deb for: " + "; ".join(sorted(set(missing))))

          keep = {info["path"] for info in chosen.values()}
          dropped = 0
          for path in pathlib.Path("output").glob("*.deb"):
              if path not in keep:
                  path.unlink()
                  dropped += 1
          for name in sorted(chosen):
              print(f"keep {name} {chosen[name]['Version']}")
          print(f"kept {len(chosen)} packages, left out {dropped} deb files")
          PY
          python3 -I "$RUNNER_TEMP/select.py" | tee packages.txt

      - name: Set app package name
        run: |
          sed -i -E "s/^TERMUX_APP__PACKAGE_NAME=\"com\.termux\"/TERMUX_APP__PACKAGE_NAME=\"$APP_PACKAGE\"/" scripts/properties.sh
          prefix=$(bash -c 'export TERMUX_SCRIPTDIR="$PWD"; . scripts/properties.sh >/dev/null; echo "$TERMUX_PREFIX"')
          echo "Prefix: $prefix"
          test "$prefix" = "/data/data/$APP_PACKAGE/files/usr"

      - name: Assemble bootstrap zip (no compiling)
        run: |
          cat > "$RUNNER_TEMP/prepare.py" <<'PY'
          import pathlib
          src = pathlib.Path("scripts/build-bootstraps.sh").read_text()

          def replace(old, new):
              global src
              if src.count(old) != 1:
                  raise SystemExit("build-bootstraps.sh has changed, expected once: " + old)
              src = src.replace(old, new)

          replace('TERMUX_PACKAGES_DIRECTORY="/home/builder/termux-packages"',
                  'TERMUX_PACKAGES_DIRECTORY="$TERMUX_SCRIPTDIR"')
          # The debs already exist, so skip compiling and the container-only arch bookkeeping.
          replace('\nmain "$@"', '\nbuild_package() { :; }\ntermux_step_handle_buildarch() { :; }\n\nmain "$@"')
          replace('add_termux_bootstrap_second_stage_files "$package_arch"',
                  'add_termux_bootstrap_second_stage_files "$TERMUX_ARCH"')
          pathlib.Path("scripts/assemble-bootstrap.sh").write_text(src)
          PY
          python3 -I "$RUNNER_TEMP/prepare.py"
          bash scripts/assemble-bootstrap.sh --architectures aarch64 > assemble.log 2>&1 || { tail -n 60 assemble.log; exit 1; }
          tail -n 3 assemble.log
          test -s bootstrap-aarch64.zip

      # The official Termux repositories are built for another app path, and installing from
      # them would break this one. They stay off until CAT has its own repository.
      - name: Turn off the official apt sources
        run: |
          mkdir -p "$RUNNER_TEMP/edit/etc/apt"
          echo "# No package repository is set up for CAT Terminal yet." > "$RUNNER_TEMP/edit/etc/apt/sources.list"
          zip -q -d bootstrap-aarch64.zip 'etc/apt/sources.list' 'etc/apt/sources.list.d/*' || test $? -eq 12
          (cd "$RUNNER_TEMP/edit" && zip -q "$GITHUB_WORKSPACE/bootstrap-aarch64.zip" etc/apt/sources.list)
          unzip -p bootstrap-aarch64.zip etc/apt/sources.list

      - name: Check the zip
        run: |
          unzip -tq bootstrap-aarch64.zip
          unzip -Z1 bootstrap-aarch64.zip > files.txt
          unzip -p bootstrap-aarch64.zip SYMLINKS.txt | sed 's/.*←\.\///' >> files.txt
          for f in bin/bash bin/apt bin/dpkg bin/git bin/ssh bin/ssh-keygen bin/python bin/nano \
                   lib/libtermux-exec-linker-ld-preload.so; do
            grep -qFx "$f" files.txt || { echo "::error::missing $f"; exit 1; }
            echo "has $f"
          done
          size=$(stat -c %s bootstrap-aarch64.zip)
          unpacked=$(unzip -l bootstrap-aarch64.zip | tail -n 1 | awk '{print $1}')
          sha=$(sha256sum bootstrap-aarch64.zip | cut -d' ' -f1)
          echo "$sha  bootstrap-aarch64.zip" > bootstrap-aarch64.zip.sha256
          printf 'zip bytes: %s\nunpacked bytes: %s\nSHA-256: %s\n' "$size" "$unpacked" "$sha" | tee summary.txt

      - name: Upload bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: cat-release-bootstrap
          path: |
            bootstrap-aarch64.zip
            bootstrap-aarch64.zip.sha256
            packages.txt
            summary.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload assemble log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-log
          path: assemble.log
          if-no-files-found: warn
